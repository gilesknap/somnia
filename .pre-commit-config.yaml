repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv.lock
      - id: check-yaml
        # Helm templates are Go templates that happen to end in .yaml, and they
        # are not YAML until helm has rendered them — a leading `{{- if }}`
        # parses as a flow mapping and fails here. The chart is checked by
        # `helm lint` and by rendering it two ways, in .github/workflows/_helm.yml.
        exclude: ^Charts/somnia/templates/
      - id: check-merge-conflict
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: ruff
        name: lint with ruff
        language: system
        entry: ruff check --force-exclude --fix
        types: [python]
        require_serial: true

      - id: ruff-format
        name: format with ruff
        language: system
        entry: ruff format --force-exclude
        types: [python]
        require_serial: true

      # The page is the player now, so the largest state machine in somnia is
      # written in JavaScript and pytest cannot see a line of it. This runs it
      # against a fake media element under node's own test runner — no npm, no
      # browser, a third of a second. It takes no file names on purpose: bare
      # `node --test` finds every *.test.mjs there is, so a new one is picked
      # up by writing it.
      - id: web-tests
        name: play the book in a fake browser
        language: system
        entry: node --test
        pass_filenames: false
        files: ^(src/somnia/web/|tests/web/)

      - id: uv-sync
        name: update uv.lock and venv
        pass_filenames: false
        language: system
        entry: uv sync
        files: ^(uv\.lock|pyproject\.toml)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # The install scripts are the one thing here a stranger runs before they have
  # any of somnia, so a shell mistake in them lands on a machine we cannot see.
  # shellcheck-py ships the binary in a wheel, so this needs no Go, no docker
  # and no system package.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
