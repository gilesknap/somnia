name: Package helm chart

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: If true, pushes the chart to the OCI registry on tags

env:
  HELM_VERSION_TO_INSTALL: 3.17.1

jobs:
  package-helm-chart:
    name: Package and Push Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Install helm
        uses: Azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION_TO_INSTALL }}

      # Helm will not accept the version strings git tags happily carry, and
      # the packaging step is far enough down the job that finding out there
      # costs a wait. Checked first instead.
      - name: Check helm version tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+((-alpha|-beta|-rc)\.[0-9]+)?$ ]]; then
            echo "Valid version format: '${VERSION}'"
          else
            echo "Invalid version: '${VERSION}'. Expected 'X.Y.Z' or 'X.Y.Z-beta.1' or 'X.Y.Z-alpha.1'"
            exit 1
          fi

      - name: Lint helm chart
        run: helm lint Charts/somnia

      # Lint only checks the chart parses. These render it the two ways it is
      # actually used — the default (no ingress, one node) and the deployment
      # this chart was written for — so a template that only breaks when a
      # value is set breaks here rather than in ArgoCD.
      - name: Render the chart with its defaults
        run: helm template somnia Charts/somnia > /dev/null

      - name: Render the chart as it is deployed
        run: |
          helm template somnia Charts/somnia \
            --set node=node03 \
            --set ingress.enabled=true \
            --set ingress.className=tailscale \
            --set ingress.host=somnia \
            --set persistence.storageClassName=local-nvme \
            --set secret.name=somnia-env > /dev/null

      - name: Package helm chart
        env:
          # Stamp the real version from the tag; off a tag it stays at 0.0.0 so a PR
          # build still produces a (throwaway) package and exercises packaging.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          set -xe
          mkdir -p charts
          helm package -u --app-version "${VERSION}" --version "${VERSION}" Charts/somnia
          mv somnia-*.tgz charts/

      - name: Push tagged helm chart to registry
        if: inputs.publish && github.ref_type == 'tag'
        run: |
          set -x
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io/${{ github.repository_owner }} --username ${{ github.repository_owner }} --password-stdin
          REGISTRY=oci://ghcr.io/${{ github.repository_owner }}/charts
          for i in charts/*.tgz; do
            helm push "${i}" "${REGISTRY,,}"
          done
