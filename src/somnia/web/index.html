<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0a09" />
    <meta name="color-scheme" content="dark" />
    <title>somnia</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- One screen. There is nowhere else to go, nothing to come back from, and
         no state a wrong press could leave them stranded in — at 2am the whole
         of the app has to be the thing already in front of them.

         The order down the page is the order a hand reaches: the name, the way
         to the books and the one button that throws anything away, all of them
         as far from the thumb as the screen allows; the conversation in the
         middle where it is read rather than touched; and the two things pressed
         without looking — the book and the microphone — where a hand already
         holding the phone can find them.

         The one screen now has one overlay over it — #candidates, at the foot
         of this file — and it is still the same screen underneath. It is raised
         only by an answer that is itself a choice ("which of these places did
         you mean?"), the book keeps playing beneath it, nothing has moved while
         it is up, and its cancel button puts it away having changed nothing at
         all. It is not a route and there is nothing to come back from: the ways
         out are a row, cancel, and the agent moving the book itself, and every
         one of them leaves the page in a state it already knows how to be
         in.

         And now a second one — #queue, after it — which is the harder of the
         two to justify, because the first answers a question the listener has
         just asked and this one is a thing somebody goes looking for. Three
         things make it the same screen rather than a route. It is opened only
         on purpose, from the far corner, by the smallest control on the page.
         It holds no payload, so nothing else on the page ever has to close it
         and there is nothing in it to go stale — which is why the six places
         that take the candidate list down have no twin here. And it adds books
         rather than switching between them: nothing on it opens a book, so
         "the page opens the book they were last listening to; changing books is
         done by asking" is still true word for word. The way out is `close`,
         and close changes nothing at all. -->

    <!-- One action, the name, and one quiet action — in that order across the
         top, which is the order of how much anybody has to do with them.

         Both buttons are still in a far corner, and that half of the old
         argument stands: opening a picker over a playing book, or throwing a
         conversation away, must be something somebody decided to do rather
         than something a hand finds on the way to the microphone. What has
         gone is the other half. `books` used to be as quiet as `start over`
         and it was the only way to add a book at all, and a control nobody can
         find is a control that is not there — so distance is still doing the
         work of keeping it off a sleepy thumb, and the pill is doing the work
         of being findable. It still carries no badge and no count: a book
         finishing at 3am is not news to somebody asleep, and a dot that has to
         be cleared is a second thing to press.

         It says `books` and not `library` because that is the word on the
         panel it opens, and a button and the screen it raises disagreeing
         about their own name is a thing to work out in the dark.

         `start over` keeps the right-hand corner to itself and nothing else is
         ever allowed in it. It is the one control on the page that throws
         something away, it takes two presses now, and the second press is
         about the conversation — never the book's position. -->
    <header>
      <button id="books" type="button">
        <span class="pill">
          <!-- Drawn, for the reason the transport's glyphs are: a caret typed
               as a character is whatever size and weight the phone's symbol
               font decided, sitting on a baseline rather than beside a word. -->
          <svg
            class="caret"
            viewBox="0 0 6 10"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M0 0 6 5 0 10Z" fill="currentColor" />
          </svg>
          books
        </span>
      </button>
      <h1>somnia</h1>
      <button id="restart" type="button" class="quiet">start over</button>
    </header>

    <main id="transcript" aria-live="polite">
      <p class="said agent">Where do you want to be?</p>
    </main>

    <p id="status" aria-live="polite"></p>

    <!-- One element for the whole life of the page. It is never removed, never
         given an empty src and never loaded on nothing: emptying it is the
         documented way to dismiss the media notification, and doing that with
         the screen off in a pocket is not recoverable from. -->
    <audio id="player" preload="metadata"></audio>

    <section id="player-bar" hidden>
      <div id="now-playing">
        <!-- The book, and then the chapter of it. The manifest has carried the
             book's own name since the beginning and the page drew everything
             else out of it — the chapter, both clocks, the album on the lock
             screen — while the one line that answers "am I in the right book?"
             was on no screen at all. Somebody who queued three books before bed
             had to press play and listen to find out which one they had come
             back to.

             It is the headline because it is the only thing here that is true
             all night. Everything under it changes while they sleep. -->
        <p id="book-title"></p>

        <!-- Both of these are one line and cut with an ellipsis rather than
             allowed to wrap, and that is the whole discipline of this stack:
             everything below — the chapter circles, the clocks, the transport —
             would be pushed down the screen by the one book whose title ran to
             two lines, and the bottom of that stack is the button a hand
             arrives at without looking first. -->
        <p id="chapter-title"></p>

        <!-- How far into this chapter, under the name of the chapter it is
             counting. It sat between the two skip buttons until the count took
             that place, which is the better use of the gap: the number between
             two controls should be the number those controls change, and what
             prev and next change is which chapter this is, not how many minutes
             of it have gone.

             It is bare rather than boxed here for the same reason it was there.
             A border around it would make it look pressable, and a control that
             looks pressable and does nothing is a worse thing to meet in the
             dark than a plain number is. -->
        <p id="chapter-clock"></p>

        <!-- Two circles and, between them, the number they change. `chapter`
             over `4 of 37`: the word is a label small enough not to be read
             twice, and the count is the one thing on this screen that says how
             much book is left without anybody doing arithmetic on a clock.

             When nobody wrote the total down it says `chapter 4` and stops
             there. That is not a rare case — it is every book on the box this
             runs on, all of them rendered before there was a column to write it
             in — and `4 of 0` or a denominator guessed from the chapters that
             happen to have landed would both be worse than a number with
             nothing after it. -->
        <div class="chapter-strip">
          <button
            id="prevchapter"
            type="button"
            class="chapter-skip"
            aria-label="Previous chapter"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M17.5 5.5 10 12l7.5 6.5Z" fill="currentColor" />
              <rect
                x="6.4"
                y="5.5"
                width="2.6"
                height="13"
                rx="1.1"
                fill="currentColor"
              />
            </svg>
          </button>
          <p class="chapter-of">
            <span id="chapter-word">chapter</span>
            <span id="chapter-count"></span>
          </p>
          <button
            id="nextchapter"
            type="button"
            class="chapter-skip"
            aria-label="Next chapter"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.5 5.5 14 12l-7.5 6.5Z" fill="currentColor" />
              <rect
                x="15"
                y="5.5"
                width="2.6"
                height="13"
                rx="1.1"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>

        <!-- Deliberately below the chapter strip and not above it. It is the
             dead band that keeps the chapter buttons off the transport: with
             the strip directly above −30, a thumb reaching low and landing high
             gets a whole chapter instead of thirty seconds, and has to work out
             in the dark where it went and how to come back. The same trick, and
             the same reason, as the wide margin already under the sleep
             timer. -->
        <p id="whereabouts">
          <span id="clock"></span>
          <!-- The sleep timer is its own readout: it says how long the night
               has left, and a tap is what sets it. Taps walk 15, 30, 45 and 60
               minutes, then the end of the chapter, then off again — one
               target that is always in the same place and always says what it
               is doing, rather than a menu to be opened, read and dismissed
               with the lights off. Six taps wrap, so the worst a mis-tap can
               do is offer to end the night early, and the next tap takes it
               back.

               It is here and not in the transport below on purpose. A control
               that can end the night early — or fail to — has no business
               within a thumb's width of the one button that gets pressed
               without looking. -->
          <button id="sleep" type="button" aria-label="Sleep timer, off">
            sleep
          </button>
        </p>
      </div>
      <!-- Untouched: three buttons, the same three, at the same size they were
           measured against a thumb. Everything the chapter needs happens a row
           and a dead band away from here, because this is the row that gets
           pressed without looking and it only stays that way while what is in
           it never moves. -->
      <div class="transport">
        <button id="back30" type="button" aria-label="Back thirty seconds">
          −30
        </button>
        <!-- Drawn rather than typed. A glyph would be whatever size and weight
             the phone's symbol font decided, sitting on a baseline rather than
             in the middle of the button; this is the same shape everywhere and
             it is the size it was meant to be. Which half shows is a class,
             set in drawPlayer. -->
        <button id="playpause" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              class="play"
              d="M8.5 5.5 18 12 8.5 18.5Z"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linejoin="round"
            />
            <g class="pause" fill="currentColor">
              <rect x="7.2" y="5" width="3.8" height="14" rx="1.4" />
              <rect x="13" y="5" width="3.8" height="14" rx="1.4" />
            </g>
          </svg>
        </button>
        <button id="fwd30" type="button" aria-label="Forward thirty seconds">
          +30
        </button>
      </div>
    </section>

    <form id="composer" autocomplete="off">
      <!-- A search box, not a text box, and autocomplete off on the field as
           well as the form: between them they stop Android offering to fill in
           passwords and cards, which costs a strip of screen above the keyboard
           on the one page where the keyboard is already the expensive part. -->
      <input
        id="question"
        type="search"
        enterkeyhint="send"
        autocomplete="off"
        placeholder="the bit where the horse dies"
        aria-label="What are you looking for?"
      />
      <button id="talk" type="button" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"
            fill="currentColor"
          />
          <path
            d="M5 11a7 7 0 0 0 14 0M12 18v3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </form>

    <!-- Still one screen. This is over the page, not away from it: the book
         keeps playing underneath, nothing has moved yet, and cancel puts it
         back exactly as it was. It exists because the alternative was a
         conversation — "did you mean the one an hour in or the one at four
         hours?" — read in the dark by someone half asleep, and a list of times
         is something a thumb can answer without composing a sentence. The three
         ways out are a row, cancel, and the agent moving the book itself, and
         each leaves the page in a state it already knows how to be in.

         Last in the document on purpose, for the same reason as everything
         above it: the DOM and tab order end with the thing a hand reaches for,
         and while the overlay is up that is cancel.

         Not a <dialog>, and showModal() is never called: a modal dialog moves
         focus, and this page never takes focus from anybody. role="dialog" and
         aria-modal are left off for the same reason — aria-modal is a promise
         that everything behind it is inert, and everything behind it is a book
         still playing that the lock screen can still stop. -->
    <section id="candidates" hidden aria-labelledby="candidates-title">
      <h2 id="candidates-title">Where do you mean?</h2>
      <!-- Which book, and only when it is not the one already playing. For the
           book they are listening to, naming it is a line of type spent saying
           what they already know. -->
      <p id="candidates-book" hidden></p>
      <ol id="candidate-list"></ol>
      <!-- Outside the scrolling list, so however many rows there are the way
           out is in the same place, at the bottom, where a hand already holding
           the phone is. -->
      <div id="candidates-foot">
        <button id="candidates-cancel" type="button">cancel</button>
      </div>
    </section>

    <!-- The books panel. Sibling of #candidates and after it, built to the same
         rules and for the same reasons: over the page rather than away from it,
         the book still playing underneath, not a <dialog>, showModal() never
         called, no role and no aria-modal — because aria-modal is a promise
         that everything behind it is inert, and everything behind it is a book
         somebody is listening to.

         The order down it is the order the questions are asked in. Is anything
         happening — the live rows, at the top, where the eye lands. Did
         anything go wrong — the rows that ended in the last day, under them,
         because a failure is worth reading once and is not news twice. And then
         adding one, which is the reason somebody opened this at all but is also
         the only part of it that wants a keyboard, so it sits below the reading
         where the keyboard can cover it without covering anything else.

         #queue-foot is outside the scrolling part, so `close` is in the same
         place however many rows there are and whatever the keyboard is doing.
         That matters more here than on the list of places: this panel can be
         open with a keyboard up, and a way out that has been pushed under the
         keyboard is a way out that does not exist. -->
    <section id="queue" hidden aria-labelledby="queue-title">
      <h2 id="queue-title">Books</h2>
      <div id="queue-scroll">
        <ul id="queue-live"></ul>
        <ul id="queue-gone"></ul>
        <!-- Whether what is above is what somnia thinks, or the last thing it
             said before the tailnet went. An empty queue and an unreachable
             server look identical and mean opposite things. -->
        <p id="queue-note"></p>
        <!-- The one place on the panel where reading turns into doing, and the
             only thing marking it is a word. Everything above is somnia
             reporting — what is rendering, what stopped, whether it can be
             reached at all — and everything below is somebody adding a book.
             Two lists and a form separated by nothing but gaps left that turn
             to be worked out from the contents of the rows.

             Mono, uppercase and small enough that it cannot be mistaken for
             something to press or something to read: it is a rule with a word
             on it. It says gutenberg because that is where the books come from
             and it is the only warning that a search here is not a search of
             the shelf. -->
        <p class="section-label">bring in something new · gutenberg</p>
        <!-- A search box, and a button, and no round trip per keystroke: the
             tailnet is a phone talking to a VPS, and a request per letter of
             "treasure island" is fifteen requests for one answer. autocomplete
             off on both, as on the composer, so Android does not offer to fill
             in a password over the top of the results. -->
        <form id="queue-search" autocomplete="off">
          <input
            id="queue-query"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            placeholder="a title, or an author"
            aria-label="Which book?"
          />
          <button id="queue-find" type="submit">find</button>
        </form>
        <ul id="queue-results"></ul>
        <!-- Whatever the server said about the last press. It is the server's
             own sentence, from the same function the agent's add_book returns,
             so the panel and the voice cannot disagree about what happened. -->
        <p id="queue-said"></p>
      </div>
      <div id="queue-foot">
        <button id="queue-close" type="button">close</button>
      </div>
    </section>

    <!-- Two layers over the whole page, and neither of them is a control.
         They come after `cancel` and `close` in the document without breaking
         the rule that puts those last: a paragraph and an empty div are not
         tab stops and cannot be pressed, so the last thing a hand can reach is
         still the way out of whichever overlay is up.

         The toast is a second voice, not a replacement for #status. #status
         holds two unlike things — "listening…", which is over in a moment, and
         "tap anywhere to carry on", which is an instruction that stands until
         it is obeyed — and a line that clears itself after a few seconds
         cannot hold the second kind. So the standing sentences stay where they
         are and this says the passing ones: what a press just did, once, at
         the bottom of the screen near the thumb that did it. It is a live
         region because that is the whole job — a thing said once has to be
         heard once, including by somebody who is not looking at the screen.

         The dim layer is how the page goes darker than the phone will. Android
         has a floor on its own brightness and this room is darker than that
         floor, so the last of the light is taken off in the page instead. It
         is over everything, both overlays included, because a books panel that
         came up at full brightness would be the brightest thing in the room at
         3am.

         Being over everything is exactly why it must never take a press. The
         page arms a document-wide pointerdown when the platform refuses to
         start the sound, and a layer that swallowed that press would leave a
         paused book in the dark with the only way back to it underneath the
         thing covering the screen. `pointer-events: none` in the sheet is what
         keeps that true, and nothing in app.js listens here.

         There is nothing on the page yet that changes the level: it ships at
         0.12 and is read back from storage if something wrote one down. The
         control belongs on a settings surface this page does not have. -->
    <p id="toast" hidden aria-live="polite"></p>
    <div id="dim" aria-hidden="true"></div>

    <script src="app.js"></script>
  </body>
</html>
