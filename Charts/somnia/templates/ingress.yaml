{{- if and .Values.ingress.enabled .Values.serve.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled is true but ingress.host is empty — somnia has no login, so an ingress with no host would answer for every request that reaches the controller" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "somnia.fullname" . }}
  labels:
    {{- include "somnia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "somnia.fullname" . }}
                port:
                  number: {{ .Values.serve.port }}
{{- end }}
