[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is somnia-reader but the import package and the console
# script are both plain somnia, and that mismatch is deliberate. `somnia` on
# PyPI belongs to an unrelated AI-agent CLI, so a distribution called somnia
# could never be installed by name — `pip install somnia` fetches a stranger.
# Only what you type after `pip install` changes: `import somnia` and the
# `somnia` command are what every doc, systemd unit and habit already says.
name = "somnia-reader"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
description = "Bedtime audiobook reader with semantic seek: TTS-rendered public-domain books plus a conversational agent that finds your place again"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "httpx",
    "numpy",
    "pysbd",
    "soundfile",
    "sqlite-vec",
    "starlette",
    "uvicorn",
]
dynamic = ["version"]
license.file = "LICENSE"
readme = "README.md"
# Upper bound is pysbd: unmaintained since 2021, and its non-raw-string escape
# sequences are a hard SyntaxError from Python 3.14 on. Lift this if pysbd is
# ever revived or we deliberately swap sentence splitters (which would change
# sentence boundaries, and therefore audio, for newly rendered books).
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "copier",
    # starlette's TestClient deprecated httpx 0.x in 1.4; without httpx2 it
    # raises on import, and our warning filter turns that into a test error.
    "httpx2",
    "myst-parser",
    "pre-commit",
    "pydata-sphinx-theme>=0.12",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-mermaid",
    "tox-uv",
    "types-mock",
]

[project.optional-dependencies]
# Heavy ML dependencies (torch etc.) needed to render and index books.
# Install with `pip install "somnia-reader[ml]"` on the machine that runs ingest.
ml = [
    "kokoro>=0.9",
    "sentence-transformers",
    # Named here although both of the above already pull it in, because
    # [tool.uv.sources] only binds a dependency the project declares itself.
    # Left transitive, the CPU-index pin below is silently ignored and the
    # CUDA stack comes back. See the comment on [[tool.uv.index]].
    "torch",
]

[project.scripts]
somnia = "somnia.__main__:main"

[project.urls]
GitHub = "https://github.com/gilesknap/somnia"

[[project.authors]] # Further authors may be added by duplicating this section
email = "gilesknap@gmail.com"
name = "Giles Knap"

[tool.setuptools.package-data]
# The PWA is served straight off the installed package.
#
# These globs do not recurse, so `web/voice/*` is named as well as `web/*`.
# It is belt and braces rather than the thing that makes the samples ship:
# `include-package-data` defaults to true here and setuptools_scm supplies the
# file list, so everything tracked under the package goes into the wheel
# whatever is written below — checked by building a wheel with only `web/*`
# and finding all six clips in it. Named anyway, because that default is one
# setting away from not being true, and a missing sample fails silently: the
# picker still picks and simply never plays anything.
somnia = ["web/*", "web/voice/*"]

[tool.setuptools_scm]
version_file = "src/somnia/_version.py"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = false # Ignore missing stubs in imported modules

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
addopts = """
    --tb=native -vv --doctest-modules --doctest-glob="*.rst"
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = [
    "error",
    # pysbd (unmaintained but best-in-class sentence splitter) has old-style
    # escape sequences that raise SyntaxWarning on import under Python 3.12+
    "ignore:invalid escape sequence:SyntaxWarning",
    "ignore:invalid escape sequence:DeprecationWarning",
]
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "docs src tests"

[tool.coverage.run]
patch = ["subprocess"]
data_file = "/tmp/somnia.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

[tool.tox]
skipsdist = true
# envs to runs automatically with tox -p
env_list = ["pre-commit", "type-checking", "tests", "docs"]

[tool.tox.env_run_base]
# Pass all environment variables to the test environments
passenv = ["*"]

[tool.tox.env.pre-commit]
description = "Run pre-commit on all files"
commands = [
    [
        "pre-commit",
        "run",
        "--all-files",
        "--show-diff-on-failure",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.type-checking]
description = "Run pyright"
commands = [
    [
        "pyright",
        "--pythonpath",
        "{env:VIRTUAL_ENV}/bin/python",
        "src",
        "tests",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.tests]
description = "Run tests with coverage"
commands = [
    [
        "pytest",
        "--cov=somnia",
        "--cov-report",
        "term",
        "--cov-report",
        "xml:cov.xml",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.docs]
description = "Run docs build with clean environment"
commands = [
    [
        "sphinx-build",
        "--fresh-env",
        "--show-traceback",
        "--fail-on-warning",
        "--keep-going",
        "docs",
        "build/html",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.docs-autobuild]
description = "Run docs with autobuild on change"
commands = [
    [
        "sphinx-autobuild",
        "--show-traceback",
        "--watch",
        "README.md",
        "docs",
        "build/html",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

# torch, from PyPI and on Linux, drags the whole CUDA 13 stack behind it —
# cuda-toolkit and fifteen nvidia-* wheels, under a plain
# `sys_platform == 'linux'` marker with nothing about the architecture in it.
# aarch64 builds of those exist (they are for Grace and Jetson), so a Rockchip
# with no NVIDIA anything in it gets them too: nvidia-cublas alone is a 542MB
# wheel, and the set comes to several gigabytes of libraries that cannot be
# loaded on the machine they landed on.
#
# somnia has never wanted any of it. `somnia-doctor.sh` checks for "a CPU
# torch", the renderer is Kokoro on cores, and the embedder is a 384-dimension
# model that is faster to run than to move to a card. Pinning torch to
# PyTorch's own CPU index is what makes an arm64 image possible at all — it is
# the difference between a ~1GB image and an ~8GB one — and it makes every
# `--extra ml` dev environment smaller by the same libraries.
#
# `explicit = true` matters: without it this index is consulted for every
# package, and it mirrors a subset of PyPI badly enough to shadow things it
# should not. Named in [tool.uv.sources], it is used for torch and nothing else.
#
# This reaches uv and nothing else. [tool.uv.sources] is not standard metadata
# and does not survive into the published wheel, so `pip install
# "somnia-reader[ml]"` still takes torch off PyPI with the CUDA stack behind
# it — exactly as it did before this pin existed. What it covers is every
# environment built from this lock file: the dev container, CI, and the image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
lint.select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "N",   # pep8-naming - https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "SLF", # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
# See https://github.com/DiamondLightSource/python-copier-template/issues/154
# Remove this line to forbid private member access in tests
"tests/**/*" = ["SLF001"]
# CSV fixture rows can't be wrapped
"tests/test_catalog.py" = ["E501"]
